databases:
  - name: green-world-db
    region: frankfurt
    databaseName: green_world
    user: green_world

services:
  - type: web
    name: green-world-api
    runtime: node
    region: frankfurt
    rootDir: backend
    buildCommand: npm install
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: green-world-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: WEB_ORIGINS
        sync: false
      - key: PGSSLMODE
        value: require
      - key: PGSSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none

<script>
// Force Telegram WebView onto the current frontend build from either entry host.
const GREEN_WORLD_BUILD_ID = '20261107-091200';
if (location.hostname === 'caliwiz888-oss.github.io') {
  const target = new URL('https://green-world-game.onrender.com/');
  const incoming = new URLSearchParams(location.search);
  incoming.forEach((value, key) => target.searchParams.append(key, value));
  target.searchParams.set('gwbuild', GREEN_WORLD_BUILD_ID);
  target.hash = location.hash;
  location.replace(target.toString());
} else if (location.hostname === 'green-world-game.onrender.com') {
  const current = new URL(location.href);
  if (current.searchParams.get('gwbuild') !== GREEN_WORLD_BUILD_ID) {
    current.searchParams.set('gwbuild', GREEN_WORLD_BUILD_ID);
    location.replace(current.toString());
  }
}
</script>

<div id="login"><div class="login-card"><h1>GREEN WORLD</h1><p>Новый мир готовится к открытию. Войди через Telegram, чтобы открыть 3D-мир.</p><button class="smallbtn" id="retry-login">ПОДКЛЮЧИТЬ TELEGRAM</button><p id="login-error"></p></div></div>

<script>window.GREEN_WORLD_API_URL='https://green-world-api-mx3v.onrender.com';</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
/* Telegram sign-in must not depend on the Three.js module loading successfully. */
(()=>{
 const button=document.getElementById('retry-login');
 window.GREEN_WORLD_MODULE_READY=false;
 setTimeout(()=>{if(!window.GREEN_WORLD_MODULE_READY){if(error)error.textContent='Графический модуль не запустился. Проверяю загрузку 3D-сцены.';}},25000);
 const error=document.getElementById('login-error');
 const api=window.GREEN_WORLD_API_URL;
 let connecting=false;
 async function connectTelegram(){
  if(connecting)return;
  connecting=true;
  button.disabled=true;
  button.textContent='ПОДКЛЮЧЕНИЕ…';
  error.textContent='Проверяем подключение Telegram…';
  try{
   const tg=window.Telegram&&window.Telegram.WebApp;
   const initData=tg&&tg.initData||'';
   if(!initData)throw new Error('Telegram не передал данные запуска. Открой игру через кнопку Mini App в меню бота.');
   tg.ready();
   tg.expand();
   const controller=new AbortController();
   const timeout=setTimeout(()=>controller.abort(),75000);
   let response;
   try {
    response=await fetch(api+'/api/auth/telegram',{
     method:'POST',credentials:'include',
     headers:{'Content-Type':'application/json'},
     body:JSON.stringify({initData}),
     signal:controller.signal
    });
   } finally { clearTimeout(timeout); }
   const data=await response.json().catch(()=>({}));
   if(!response.ok)throw new Error(data.error||'Ошибка сервера '+response.status);
   window.GREEN_WORLD_AUTH_RESULT=data;
   window.dispatchEvent(new CustomEvent('green-world-auth',{detail:data}));
   error.textContent=window.GREEN_WORLD_STARTUP_ERROR||'Аккаунт подключён. Загружаем хозяйство…';
  }catch(e){
   error.textContent=e?.name==='AbortError'?'Сервер запускается дольше обычного. Подожди до 75 секунд и попробуй ещё раз.':(e&&e.message?e.message:'Не удалось подключиться. Попробуй ещё раз.');
  }finally{
   connecting=false;
   button.disabled=false;
   button.textContent='ПОДКЛЮЧИТЬ TELEGRAM';
  }
 }
 button.addEventListener('click',connectTelegram);
 window.addEventListener('error',event=>{
  if(error&&event.message){window.GREEN_WORLD_STARTUP_ERROR='Ошибка загрузки игры: '+event.message;error.textContent=window.GREEN_WORLD_STARTUP_ERROR;}
 });
 window.addEventListener('unhandledrejection',event=>{
  if(error){window.GREEN_WORLD_STARTUP_ERROR='Ошибка: '+(event.reason?.message||String(event.reason||'неизвестная ошибка'));error.textContent=window.GREEN_WORLD_STARTUP_ERROR;}
 });
 connectTelegram();
})();
</script>
<script type="module">
let THREE;
const loadThreeWithTimeout=(url,ms=8000)=>Promise.race([
 import(url),
 new Promise((_,reject)=>setTimeout(()=>reject(new Error('Тайм-аут загрузки '+url)),ms))
]);
try {
 THREE=await loadThreeWithTimeout('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js');
} catch(primaryError) {
 console.warn('[render] Primary Three.js CDN failed; trying fallback:',primaryError);
 try {
  THREE=await loadThreeWithTimeout('https://unpkg.com/three@0.170.0/build/three.module.js');
 } catch(fallbackError) {
  console.warn('[render] unpkg failed; trying esm.sh:',fallbackError);
  try {
   THREE=await loadThreeWithTimeout('https://esm.sh/three@0.170.0');
  } catch(lastError) {
   console.error('[render] All Three.js sources failed:',lastError);
   const status=document.getElementById('status');
   const error=document.getElementById('login-error');
   if(status)status.textContent='НЕ УДАЛОСЬ ЗАГРУЗИТЬ 3D-МИР';
   if(error)error.textContent='Не удалось загрузить 3D-библиотеку из трёх источников. Закрой игру и попробуй снова при стабильном интернете.';
   throw lastError;
  }
 }
}

window.GREEN_WORLD_STARTUP_STAGE='three-loaded';
const $=id=>document.getElementById(id);
const API=window.GREEN_WORLD_API_URL;
let token='';
let cameraRadius=60,cameraHeight=30;
let buildingObjects=[];
const scene=new THREE.Scene();
// Мягкий процедурный небосвод: градиент от насыщенного голубого к светлому горизонту с едва заметными облачными вуалями.
const skyCanvas=document.createElement('canvas');skyCanvas.width=8192;skyCanvas.height=4096;

function disposeObject3D(root){
 // A resource may be referenced by meshes outside the subtree being rebuilt.
 // Scan the live scene first; only dispose resources with no remaining users.
 const liveGeometries=new Set(),liveMaterials=new Set(),liveTextures=new Set();
 const textureSlots=['map','alphaMap','aoMap','bumpMap','normalMap','roughnessMap','metalnessMap','emissiveMap','envMap','lightMap','displacementMap','gradientMap','matcap'];
 const collectLive=(object)=>{
  if(!object.isMesh||!object.geometry)return;
  liveGeometries.add(object.geometry);
  const list=Array.isArray(object.material)?object.material:[object.material];
  for(const material of list){
   if(!material)continue;
   liveMaterials.add(material);
   for(const key of textureSlots){
    const texture=material[key];
    if(texture&&texture.isTexture)liveTextures.add(texture);
   }
  }
 };
 world.traverse(object=>{
  if(object===root||root.getObjectById(object.id))return;
  collectLive(object);
 });
 const materials=new Set(),textures=new Set(),geometries=new Set();
 root.traverse(object=>{
  if(!object.isMesh)return;
  if(object.geometry&&!liveGeometries.has(object.geometry))geometries.add(object.geometry);
  const list=Array.isArray(object.material)?object.material:[object.material];
  for(const material of list){
   if(!material||liveMaterials.has(material)||sharedWorldMaterials.has(material))continue;
   materials.add(material);
   for(const key of textureSlots){
    const texture=material[key];
    if(texture&&texture.isTexture&&!liveTextures.has(texture)&&!sharedWorldTextures.has(texture))textures.add(texture);
   }
  }
 });
 for(const geometry of geometries)geometry.dispose();
 for(const texture of textures)texture.dispose();
 for(const material of materials)material.dispose();
 if(root.parent)root.parent.remove(root);
}

    for(const x of [-2.96,2.96]){

    box(fallback,5.65,.24,4.65,0,2.86,0,M.gold);

    box(fallback,3.38,.96,.035,0,1.65,2.255,windowInterior,false);

    box(fallback,3.9,.045,.23,0,2.435,2.4,M.gold,false);
    box(fallback,3.82,.13,.2,0,.94,2.39,shopTrim,false);
    box(fallback,3.9,.04,.23,0,.855,2.4,M.gold,false);
    for(const x of [-1.78,-.9,0,.9,1.78]){
      box(fallback,.055,.24,.07,x,2.34,2.52,M.gold,false);
      box(fallback,.055,.24,.07,x,.94,2.52,M.gold,false);
    }
    // Raised central sign surround and matching corner caps.
    box(fallback,2.35,.12,.18,0,2.98,2.38,shopTrim,false);
    box(fallback,2.42,.04,.2,0,3.06,2.39,M.gold,false);
    for(const x of [-2.35,-1.25,0,1.25,2.35])box(fallback,.13,2.5,.22,x,1.42,2.4,M.gold);
    box(fallback,1.1,2.25,.22,0,1.35,2.48,shopTimber);
    box(fallback,6.2,.25,6.2,0,3.85,0,shopRoof);
    box(fallback,.22,.28,4.9,0,4.48,0,M.gold);
    for(let i=0;i<7;i++)box(fallback,.72,.18,.85,-2.52+i*.84,2.75,2.72,i%2?shopRoof:shopTrim);
    box(fallback,2.05,.62,.16,0,4.05,2.62,shopTimber);
    box(fallback,1.78,.34,.08,0,4.05,2.73,M.gold,false);
    box(fallback,1.7,.29,.025,0,4.05,2.785,mat(0x304c38),false);
    box(fallback,6.3,.12,1.45,0,.035,3.55,shopTrim,false);
    // Disable all shadow casting and receiving on the fallback market as well.
    fallback.traverse(object=>{if(object.isMesh){object.castShadow=false;object.receiveShadow=false}});
    market=fallback;
  }
  if(market){
    market.visible=true;
    market.traverse(object=>{object.visible=true;if(object.isMesh)object.frustumCulled=false});
    market.updateMatrixWorld(true);
    buildingObjects.push(market);
  }
  }
}
function applyPlayer(){$('login').style.display='none';try{drawPlayer()}catch(e){console.error('[render] World drawing failed:',e);$('login-error').textContent='Ошибка отображения мира: '+(e?.message||e)}}
async function request(path,body=null,retry=true){const opts={method:body===null?'GET':'POST',credentials:'include',headers:{'Content-Type':'application/json'}};if(token)opts.headers.Authorization='Bearer '+token;if(body!==null)opts.body=JSON.stringify(body);let res=await fetch(API+path,opts);if(res.status===401&&retry&&!['/api/auth/telegram','/api/auth/refresh'].includes(path)){const rr=await fetch(API+'/api/auth/refresh',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'}});if(rr.ok){token=(await rr.json()).accessToken;return request(path,body,false)}}const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||'Ошибка сервера '+res.status);return data}

const riverFlowClock=new THREE.Clock();
// GREEN WORLD — единая финальная настройка качества материалов всей сцены.
// Дизеринг уменьшает полосы на плавных градиентах света и не меняет палитру объектов.
window.GREEN_WORLD_GLOBAL_MATERIAL_FINISH={materials:0,textures:0};
scene.traverse(object=>{
 if(!object.isMesh||!object.material)return;
 const materials=Array.isArray(object.material)?object.material:[object.material];
 for(const material of materials){
   if(!material)continue;
   material.dithering=true;
   window.GREEN_WORLD_GLOBAL_MATERIAL_FINISH.materials++;
   for(const key of ['map','alphaMap','aoMap','bumpMap','displacementMap','emissiveMap','lightMap','metalnessMap','normalMap','roughnessMap']){
     const texture=material[key];
     if(!texture||!texture.isTexture)continue;
     texture.anisotropy=Math.max(texture.anisotropy||1,renderer.capabilities.getMaxAnisotropy());
     texture.magFilter=THREE.LinearFilter;
     texture.minFilter=THREE.LinearMipmapLinearFilter;
     texture.generateMipmaps=true;
     texture.needsUpdate=true;
     window.GREEN_WORLD_GLOBAL_MATERIAL_FINISH.textures++;
   }
   material.needsUpdate=true;
 }
});
cameraPosition();function animate(){requestAnimationFrame(animate);const flowDelta=Math.min(riverFlowClock.getDelta(),.05),flowTime=riverFlowClock.elapsedTime;if(riverWaterTexture){riverWaterTexture.offset.x=(riverWaterTexture.offset.x+flowDelta*(.19+.025*Math.sin(flowTime*.21)))%1;riverWaterTexture.offset.y=(riverWaterTexture.offset.y+flowDelta*(.012+.004*Math.sin(flowTime*.17)))%1;}if(riverSurfaceMesh){const p=riverSurfaceMesh.geometry.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getY(i);const wave=Math.sin(x*.34-flowTime*1.58+z*.22)*.024+Math.sin(x*.17-flowTime*1.06-z*.48)*.017+Math.sin(z*.9+flowTime*.82)*.007+Math.sin(x*.105-flowTime*.82+z*.13)*.009+Math.sin(x*.48-flowTime*1.24-z*.31)*.005;p.setZ(i,wave);}p.needsUpdate=true;riverSurfaceMesh.geometry.computeVertexNormals();}for(const sparkle of riverSparkles){const x=-25+((sparkle.phase+flowTime*sparkle.speed)%50);const edge=Math.min(x+25,25-x);const fade=THREE.MathUtils.smoothstep(edge,0,5.5);const pulse=.45+.55*(.5+.5*Math.sin(flowTime*2.4+sparkle.phase2));sparkle.mesh.position.x=x;sparkle.mesh.position.y=.145+Math.sin(flowTime*1.6+sparkle.phase2)*.006;sparkle.mesh.position.z=sparkle.z+Math.sin(flowTime*.9+sparkle.phase2)*.065;sparkle.material.opacity=(.025+.22*fade)*pulse;sparkle.mesh.scale.x=(1.1+.7*pulse);}for(const ribbon of riverFlowRibbons){const x=-25+((ribbon.phase+flowTime*ribbon.speed)%50);const edge=Math.min(x+25,25-x);const fade=THREE.MathUtils.smoothstep(edge,0,4.8);ribbon.mesh.position.x=x;ribbon.mesh.position.y=.128+Math.sin(flowTime*1.8+ribbon.offset)*.004;ribbon.mesh.position.z=ribbon.z+Math.sin(flowTime*.7+ribbon.offset)*.055;ribbon.material.opacity=(.025+.19*fade)*(.78+.22*Math.sin(flowTime*1.35+ribbon.offset));}for(const current of riverCurrentObjects){const x=-25+((current.phase+flowTime*current.speed)%50);const edge=Math.min(x+25,25-x);const fade=THREE.MathUtils.smoothstep(edge,0,4.2);current.mesh.position.x=x;current.mesh.position.y=.116+Math.sin(flowTime*1.7+current.offset)*.003;current.mesh.position.z=current.baseZ+Math.sin(flowTime*.62+current.offset)*.045;current.material.opacity=(.035+.19*fade)*(.82+.18*Math.sin(flowTime*1.25+current.offset));}for(const item of riverMotionObjects){const wave=Math.sin(flowTime*item.speed+item.phase);item.mesh.position.x=item.baseX+Math.sin(flowTime*item.speed*.72+item.phase)*item.range;item.mesh.position.y=.092+Math.max(0,wave)*.018;const pulse=.78+.22*Math.sin(flowTime*item.speed*1.8+item.phase);item.mesh.scale.x=pulse;item.mesh.material.opacity=item.baseLength<.6?.13+.16*(.5+.5*wave):.12+.12*(.5+.5*wave)}for(const ring of riverRingObjects){const cycle=(flowTime*ring.speed+ring.phase)%(Math.PI*2),progress=(1-Math.cos(cycle))*.5;const radius=.12+progress*.72;ring.mesh.position.x=ring.baseX+Math.sin(flowTime*.31+ring.phase)*.12;ring.mesh.position.z=ring.baseZ+Math.cos(flowTime*.27+ring.phase)*.1;ring.mesh.scale.set(radius,1,radius*.72);ring.material.opacity=.2*(1-progress)}for(const foam of riverFoamObjects){const drift=(flowTime*foam.speed+foam.phase)%(Math.PI*2);foam.mesh.position.x=foam.baseX+Math.sin(drift)*foam.drift;foam.mesh.position.y=.108+Math.max(0,Math.sin(drift*1.35+foam.phase))*.012;foam.mesh.position.z=foam.baseZ+Math.cos(drift*.7)*.16;const pulse=.68+.32*Math.sin(drift*1.6);foam.mesh.scale.x=(.22+(foam.phase%3)*.06)*pulse;foam.mesh.scale.z=(.055+(foam.phase%2)*.018)*(.88+.12*Math.cos(drift));foam.material.opacity=.045+.11*(.5+.5*Math.sin(drift+foam.phase))}for(const streak of riverDriftStreaks){const travel=(streak.phase+flowTime*streak.speed)%50;const edge=Math.min(travel,50-travel);const fade=THREE.MathUtils.smoothstep(edge,0,5.2);const pulse=.72+.28*Math.sin(flowTime*2.1+streak.offset);streak.mesh.position.x=-25+travel;streak.mesh.position.y=.137+Math.sin(flowTime*1.45+streak.offset)*.004;streak.mesh.position.z=streak.z+Math.sin(flowTime*.72+streak.offset)*.035;streak.mesh.scale.x=.82+.38*pulse;streak.material.opacity=(.035+.19*fade)*pulse;}for(const crest of riverWaveCrests){const travel=(crest.phase+flowTime*crest.speed)%50;const edge=Math.min(travel,50-travel);const fade=THREE.MathUtils.smoothstep(edge,0,5.5);const swell=Math.sin(flowTime*1.7+crest.offset);crest.mesh.position.x=-25+travel;crest.mesh.position.y=.145+Math.max(0,swell)*.012;crest.mesh.position.z=crest.z+Math.sin(flowTime*.83+crest.offset)*.06;crest.mesh.rotation.y=Math.sin(flowTime*.55+crest.offset)*.035;crest.material.opacity=(.018+.16*fade)*(.68+.32*(.5+.5*swell));}renderer.render(scene,camera)}animate();

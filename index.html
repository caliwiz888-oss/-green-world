<script>
// Force Telegram WebView onto the current frontend build from either entry host.
const GREEN_WORLD_BUILD_ID = '20261108-381100';
if (location.hostname === 'caliwiz888-oss.github.io') {
  const target = new URL('https://green-world-game.onrender.com/');
  const incoming = new URLSearchParams(location.search);
  incoming.forEach((value, key) => target.searchParams.append(key, value));
  target.searchParams.set('gwbuild', GREEN_WORLD_BUILD_ID);
  target.hash = location.hash;
  location.replace(target.toString());
} else if (location.hostname === 'green-world-game.onrender.com') {
  const current = new URL(location.href);
  if (current.searchParams.get('gwbuild') !== GREEN_WORLD_BUILD_ID) {
    current.searchParams.set('gwbuild', GREEN_WORLD_BUILD_ID);
    location.replace(current.toString());
  }
}
</script>

<div id="login"><div class="login-card"><h1>GREEN WORLD</h1><p>Новый мир готовится к открытию. Войди через Telegram, чтобы открыть 3D-мир.</p><button class="smallbtn" id="retry-login">ПОДКЛЮЧИТЬ TELEGRAM</button><p id="login-error"></p></div></div>
</div></div>
<script>window.GREEN_WORLD_API_URL='https://green-world-api-mx3v.onrender.com';</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
/* Telegram sign-in must not depend on the Three.js module loading successfully. */
(()=>{
 const button=document.getElementById('retry-login');
 window.GREEN_WORLD_MODULE_READY=false;
 setTimeout(()=>{if(!window.GREEN_WORLD_MODULE_READY){if(error)error.textContent='Графический модуль не запустился. Проверяю загрузку 3D-сцены.';}},25000);
 const error=document.getElementById('login-error');
 const api=window.GREEN_WORLD_API_URL;
 let connecting=false;
 async function connectTelegram(){
  if(connecting)return;
  connecting=true;
  button.disabled=true;
  button.textContent='ПОДКЛЮЧЕНИЕ…';
  error.textContent='Проверяем подключение Telegram…';
  try{
   const tg=window.Telegram&&window.Telegram.WebApp;
   const initData=tg&&tg.initData||'';
   if(!initData)throw new Error('Telegram не передал данные запуска. Открой игру через кнопку Mini App в меню бота.');
   tg.ready();
   tg.expand();
   const controller=new AbortController();
   const timeout=setTimeout(()=>controller.abort(),75000);
   let response;
   try {
    response=await fetch(api+'/api/auth/telegram',{
     method:'POST',credentials:'include',
     headers:{'Content-Type':'application/json'},
     body:JSON.stringify({initData}),
     signal:controller.signal
    });
   } finally { clearTimeout(timeout); }
   const data=await response.json().catch(()=>({}));
   if(!response.ok)throw new Error(data.error||'Ошибка сервера '+response.status);
   window.GREEN_WORLD_AUTH_RESULT=data;
   window.dispatchEvent(new CustomEvent('green-world-auth',{detail:data}));
   error.textContent=window.GREEN_WORLD_STARTUP_ERROR||'Аккаунт подключён. Загружаем хозяйство…';
  }catch(e){
   error.textContent=e?.name==='AbortError'?'Сервер запускается дольше обычного. Подожди до 75 секунд и попробуй ещё раз.':(e&&e.message?e.message:'Не удалось подключиться. Попробуй ещё раз.');
  }finally{
   connecting=false;
   button.disabled=false;
   button.textContent='ПОДКЛЮЧИТЬ TELEGRAM';
  }
 }
 button.addEventListener('click',connectTelegram);
 window.addEventListener('error',event=>{
  if(error&&event.message){window.GREEN_WORLD_STARTUP_ERROR='Ошибка загрузки игры: '+event.message;error.textContent=window.GREEN_WORLD_STARTUP_ERROR;}
 });
 window.addEventListener('unhandledrejection',event=>{
  if(error){window.GREEN_WORLD_STARTUP_ERROR='Ошибка: '+(event.reason?.message||String(event.reason||'неизвестная ошибка'));error.textContent=window.GREEN_WORLD_STARTUP_ERROR;}
 });
 connectTelegram();
})();
</script>
<script type="module">
let THREE;
const loadThreeWithTimeout=(url,ms=8000)=>Promise.race([
 import(url),
 new Promise((_,reject)=>setTimeout(()=>reject(new Error('Тайм-аут загрузки '+url)),ms))
]);
try {
 THREE=await loadThreeWithTimeout('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js');
} catch(primaryError) {
 console.warn('[render] Primary Three.js CDN failed; trying fallback:',primaryError);
 try {
  THREE=await loadThreeWithTimeout('https://unpkg.com/three@0.170.0/build/three.module.js');
 } catch(fallbackError) {
  console.warn('[render] unpkg failed; trying esm.sh:',fallbackError);
  try {
   THREE=await loadThreeWithTimeout('https://esm.sh/three@0.170.0');
  } catch(lastError) {
   console.error('[render] All Three.js sources failed:',lastError);
   const status=document.getElementById('status');
   const error=document.getElementById('login-error');
   if(status)status.textContent='НЕ УДАЛОСЬ ЗАГРУЗИТЬ 3D-МИР';
   if(error)error.textContent='Не удалось загрузить 3D-библиотеку из трёх источников. Закрой игру и попробуй снова при стабильном интернете.';
   throw lastError;
  }
 }
}

window.GREEN_WORLD_STARTUP_STAGE='three-loaded';
const $=id=>document.getElementById(id);
const API=window.GREEN_WORLD_API_URL;
let token='';
let cameraRadius=60,cameraHeight=30;
let buildingObjects=[];
const scene=new THREE.Scene();
// Мягкий процедурный небосвод: градиент от насыщенного голубого к светлому горизонту с едва заметными облачными вуалями.
const skyCanvas=document.createElement('canvas');skyCanvas.width=4096;skyCanvas.height=2048;

function disposeObject3D(root){
 // A resource may be referenced by meshes outside the subtree being rebuilt.
 // Scan the live scene first; only dispose resources with no remaining users.
 const liveGeometries=new Set(),liveMaterials=new Set(),liveTextures=new Set();
 const textureSlots=['map','alphaMap','aoMap','bumpMap','normalMap','roughnessMap','metalnessMap','emissiveMap','envMap','lightMap','displacementMap','gradientMap','matcap'];
 const collectLive=(object)=>{
  if(!object.isMesh||!object.geometry)return;
  liveGeometries.add(object.geometry);
  const list=Array.isArray(object.material)?object.material:[object.material];
  for(const material of list){
   if(!material)continue;
   liveMaterials.add(material);
   for(const key of textureSlots){
    const texture=material[key];
    if(texture&&texture.isTexture)liveTextures.add(texture);
   }
  }
 };
 world.traverse(object=>{
  if(object===root||root.getObjectById(object.id))return;
  collectLive(object);
 });
 const materials=new Set(),textures=new Set(),geometries=new Set();
 root.traverse(object=>{
  if(!object.isMesh)return;
  if(object.geometry&&!liveGeometries.has(object.geometry))geometries.add(object.geometry);
  const list=Array.isArray(object.material)?object.material:[object.material];
  for(const material of list){
   if(!material||liveMaterials.has(material)||sharedWorldMaterials.has(material))continue;
   materials.add(material);
   for(const key of textureSlots){
    const texture=material[key];
    if(texture&&texture.isTexture&&!liveTextures.has(texture)&&!sharedWorldTextures.has(texture))textures.add(texture);
   }
  }
 });
 for(const geometry of geometries)geometry.dispose();
 for(const texture of textures)texture.dispose();
 for(const material of materials)material.dispose();
 if(root.parent)root.parent.remove(root);
}

   cylinder(t,.265,.265,.075,px,.88,pz,towerColumnMaterial,32);
   cylinder(t,.195,.195,.12,px,.99,pz,towerColumnMaterial,32);
   cylinder(t,.175,.175,.055,px,1.09,pz,gold,32);
   cylinder(t,.185,.185,.055,px,4.35,pz,gold,32);
   cylinder(t,.245,.245,.16,px,4.60,pz,stone,32);
   cylinder(t,.275,.275,.075,px,4.68,pz,towerColumnMaterial,32);

  }
  // Два окна на башню: одно нижнее и одно верхнее, с каменным обрамлением.
  for(const y of [1.15,3.05]){
   const outer=new THREE.Shape();

   sh.moveTo(-.22,0);sh.lineTo(-.22,.67);

   sh.lineTo(.22,0);sh.closePath();
   const frame=new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:.10,bevelEnabled:true,bevelSegments:2,steps:1,bevelSize:.02,bevelThickness:.02}),bronze);
   frame.position.set(0,y,1.12);frame.castShadow=false;frame.receiveShadow=false;t.add(frame);
   const glass=new THREE.Mesh(new THREE.ShapeGeometry(sh),towerGlass);
   glass.position.set(0,y,1.23);glass.castShadow=false;glass.receiveShadow=false;t.add(glass);
   box(t,.035,.88,.035,0,y+.32,1.26,gold,false);
   sphere(t,.14,0,y+.68,1.25,tealLight,.70);
   // Отдельный подоконник и профилированный арочный сандрик.
   box(t,.62,.12,.25,0,y-.09,1.17,stone);
   box(t,.58,.06,.27,0,y-.02,1.20,gold);
   box(t,.66,.10,.25,0,y+.91,1.16,cream);
   box(t,.60,.045,.27,0,y+1.01,1.18,gold);
  }
  // Арочные архивольты из отдельных клиновидных камней, как в эталонной каменной кладке.
  // Камни повторяют дугу окна и визуально связывают наличник с цилиндрическим фасадом.
  for(const y of [1.15,3.05]){
   const radius=.365,archCenter=y+.68;
   for(let j=0;j<=8;j++){
    const a=Math.PI-j*Math.PI/8;
    const voussoir=box(t,.135,.145,.085,
      Math.cos(a)*radius,archCenter+Math.sin(a)*radius,1.075,

    voussoir.rotation.z=a+Math.PI/2;
   }
   // Центральный замковый камень слегка выступает над остальными сегментами.
   box(t,.17,.19,.095,0,archCenter+radius+.015,1.08,cream,false);
  }
   // Полукруглые балконы по эталону: половина круга выступает вперёд,
   // задняя прямая кромка скрыто входит в стену башни; центр строго по оси башни.
   for(const balconyY of [1.02,2.92]){

    const rimGeo=new THREE.ExtrudeGeometry(balconyShape,{depth:.045,bevelEnabled:false,steps:1});
    rimGeo.rotateX(-Math.PI/2);
    const rim=new THREE.Mesh(rimGeo,cream);
    rim.position.set(0,balconyY+.07,chordZ);
    rim.castShadow=false;rim.receiveShadow=false;t.add(rim);
    // Золотой кант и поручень повторяют только переднюю полукруглую дугу.
    const arcPoints=[];
    for(let j=0;j<=48;j++){
     const a=Math.PI+j*Math.PI/48;
     arcPoints.push(new THREE.Vector3(radius*.97*Math.cos(a),balconyY+.12,chordZ-radius*.97*Math.sin(a)));
    }
    const edge=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(arcPoints),64,.018,8,false),gold);
    edge.castShadow=false;edge.receiveShadow=false;t.add(edge);
    const railPoints=[];
    for(let j=0;j<=40;j++){
     const a=Math.PI+j*Math.PI/40,x=.67*Math.cos(a),z=chordZ-.67*Math.sin(a);
     railPoints.push(new THREE.Vector3(x,balconyY+.39,z));
     if(j%2===0){
      cylinder(t,.022,.025,.20,x,balconyY+.245,z,cream,10);
      sphere(t,.03,x,balconyY+.355,z,gold,.75);
     }
    }
    const rail=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(railPoints),64,.025,8,false),gold);
    rail.castShadow=false;rail.receiveShadow=false;t.add(rail);
    // Цветочные кашпо расположены симметрично по передней дуге.
    for(let j=0;j<7;j++){
     const a=Math.PI+(j/6)*Math.PI,x=.58*Math.cos(a),z=chordZ-.58*Math.sin(a);
     box(t,.085,.05,.075,x,balconyY+.115,z,stone,false);
     sphere(t,.03,x,balconyY+.18,z,green,.78);
     sphere(t,.034,x,balconyY+.225,z,j%3===0?lilac:(j%2?white:pink),.82);
     sphere(t,.023,x-.02,balconyY+.21,z+.012,j%2?pink:white,.9);
     sphere(t,.023,x+.02,balconyY+.21,z-.012,j%3===0?white:lilac,.9);
    }
   }
   // Верхний аттик и многоступенчатый карниз под конической крышей.
  cylinder(t,.98,.98,.13,0,4.96,0,stone,n);
  cylinder(t,1.05,1.05,.12,0,5.08,0,cream,n);
  // Тонкое профилированное каменное кольцо у основания синего купола — как в эталоне.

  cylinder(t,1.125,1.125,.025,0,5.34,0,cream,n);
  // Коническая кровля башни сохранена по форме; сланцево-синий цвет и золотой наконечник

  const towerRoofY=5.34,towerRoofH=2.48,towerRoofR=1.08;
  const towerRoofPoint=(y,a,offset=0)=>{
   const r=towerRoofR*(1-(y-towerRoofY)/towerRoofH)+offset;
   return new THREE.Vector3(Math.sin(a)*r,y,Math.cos(a)*r);
  };
  for(let j=0;j<16;j++){
   const a0=j*Math.PI*2/16+.008,a1=(j+1)*Math.PI*2/16-.008;
   for(let row=0;row<10;row++){
    const y0=towerRoofY+towerRoofH*row/10+.006;
    const y1=towerRoofY+towerRoofH*(row+1)/10-.006;
    const p=[towerRoofPoint(y0,a0,.012),towerRoofPoint(y1,a0,.012),
             towerRoofPoint(y1,a1,.012),towerRoofPoint(y0,a1,.012)];
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.Float32BufferAttribute(p.flatMap(v=>[v.x,v.y,v.z]),3));
    geo.setIndex([0,1,2,0,2,3]);geo.computeVertexNormals();
    const panel=new THREE.Mesh(geo,copperMats[(j+row)%copperMats.length]);
    panel.castShadow=true;panel.receiveShadow=true;t.add(panel);
   }
   const seamPoints=[];
   for(let k=0;k<=28;k++){
    const y=towerRoofY+towerRoofH*k/28;
    seamPoints.push(towerRoofPoint(y,(a0+a1)/2,.035));
   }
   const seam=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(seamPoints),36,.014,7,false),copperBright);
   seam.castShadow=false;seam.receiveShadow=false;t.add(seam);
  }
  // Небольшие поперечные фальцы повторяют металлические панели основной крыши.
  for(let row=1;row<10;row++){
   const y=towerRoofY+towerRoofH*row/10;
   for(let j=0;j<16;j++){
    const a0=j*Math.PI*2/16+.012,a1=(j+1)*Math.PI*2/16-.012;
    const edge=new THREE.Mesh(new THREE.TubeGeometry(
     new THREE.LineCurve3(towerRoofPoint(y,a0,.025),towerRoofPoint(y,a1,.025)),8,.009,5,false),copperDark);
    edge.castShadow=false;edge.receiveShadow=false;t.add(edge);
   }
  }
  cylinder(t,.075,.075,.22,0,7.85,0,goldRoof,16);
  sphere(t,.11,0,8.01,0,goldRoof,.9);
  cone(t,.06,.22,0,8.18,0,goldRoof,16);
 }
  // Фасадные цветочные ящики под окнами удалены по просьбе пользователя.
  // Каменная отделка боковых стен: угловые русты и непрерывные пояса
 // продолжают архитектуру фасада по всему объёму дома.
 for(const side of [-1,1]){
  for(const z of [-2.18,-1.12,0,1.12,2.18]){
   for(const y of [.92,1.42,2.92,3.42]){
    box(center,.16,.25,.30,side*3.32,y,z,y===1.42?stone:cream,false);
   }
  }
  for(const y of [.82,2.62,3.82,4.12]){
   box(center,.18,.065,4.48,side*3.32,y,-.08,stone,false);
   box(center,.19,.035,4.50,side*3.33,y+.07,-.08,cream,false);
  }
 }
 // Рельефные каменные панели на торцевых простенках под кровлей.
 for(const side of [-1,1]){
  box(center,.12,.42,1.05,side*3.29,4.02,-1.70,cream,false);
  box(center,.14,.10,1.12,side*2.90,4.28,-1.70,gold,false);
 }
 // Дымоходы главного дома удалены по просьбе пользователя.
 // Каменные угловые накладки у основания башен связывают их с главным корпусом.
 for(const x of [-3.32,3.32]){
  box(center,.34,.18,.28,x,.62,2.48,cream,false);
  box(center,.38,.07,.30,x,.72,2.50,gold,false);
 }
 // Два декоративных фонаря возле фасада удалены по просьбе пользователя.
 return disableCastShadows(g);
}

async function request(path,body=null,retry=true){const opts={method:body===null?'GET':'POST',credentials:'include',headers:{'Content-Type':'application/json'}};if(token)opts.headers.Authorization='Bearer '+token;if(body!==null)opts.body=JSON.stringify(body);let res=await fetch(API+path,opts);if(res.status===401&&retry&&!['/api/auth/telegram','/api/auth/refresh'].includes(path)){const rr=await fetch(API+'/api/auth/refresh',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'}});if(rr.ok){token=(await rr.json()).accessToken;return request(path,body,false)}}const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||'Ошибка сервера '+res.status);return data}

const riverFlowClock=new THREE.Clock();
// GREEN WORLD — единая финальная настройка качества материалов всей сцены.

window.GREEN_WORLD_GLOBAL_MATERIAL_FINISH={materials:0,textures:0};
scene.traverse(object=>{
 if(!object.isMesh||!object.material)return;
 const materials=Array.isArray(object.material)?object.material:[object.material];
 for(const material of materials){
   if(!material)continue;
   material.dithering=!object.userData.crispRoad&&!material.isMeshBasicMaterial;
   window.GREEN_WORLD_GLOBAL_MATERIAL_FINISH.materials++;
   for(const key of ['map','alphaMap','aoMap','bumpMap','displacementMap','emissiveMap','lightMap','metalnessMap','normalMap','roughnessMap']){
     const texture=material[key];
     if(!texture||!texture.isTexture)continue;
     const startupAnisotropy=Math.min(renderer.capabilities.getMaxAnisotropy(),18);
     if(texture.anisotropy!==startupAnisotropy){texture.anisotropy=startupAnisotropy;texture.needsUpdate=true;}
     window.GREEN_WORLD_GLOBAL_MATERIAL_FINISH.textures++;
   }
   material.needsUpdate=true;
 }
});
cameraPosition();function animate(){requestAnimationFrame(animate);const flowDelta=Math.min(riverFlowClock.getDelta(),.05),flowTime=riverFlowClock.elapsedTime;if(riverWaterTexture){riverWaterTexture.offset.x=(riverWaterTexture.offset.x+flowDelta*(.19+.025*Math.sin(flowTime*.21)))%1;riverWaterTexture.offset.y=(riverWaterTexture.offset.y+flowDelta*(.012+.004*Math.sin(flowTime*.17)))%1;}if(riverSurfaceMesh){const p=riverSurfaceMesh.geometry.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getY(i);const wave=Math.sin(x*.34-flowTime*1.72+z*.22)*.031+Math.sin(x*.17-flowTime*1.18-z*.48)*.022+Math.sin(z*.9+flowTime*.94)*.009+Math.sin(x*.105-flowTime*.91+z*.13)*.012+Math.sin(x*.48-flowTime*1.36-z*.31)*.007;p.setZ(i,wave);}p.needsUpdate=true;riverSurfaceMesh.geometry.computeVertexNormals();}for(const sparkle of riverSparkles){const x=-25+((sparkle.phase+flowTime*sparkle.speed)%50);const edge=Math.min(x+25,25-x);const fade=THREE.MathUtils.smoothstep(edge,0,5.5);const pulse=.45+.55*(.5+.5*Math.sin(flowTime*2.4+sparkle.phase2));sparkle.mesh.position.x=x;sparkle.mesh.position.y=.145+Math.sin(flowTime*1.6+sparkle.phase2)*.006;sparkle.mesh.position.z=sparkle.z+Math.sin(flowTime*.9+sparkle.phase2)*.065;sparkle.material.opacity=(.025+.22*fade)*pulse;sparkle.mesh.scale.x=(1.1+.7*pulse);}for(const ribbon of riverFlowRibbons){const x=-25+((ribbon.phase+flowTime*ribbon.speed)%50);const edge=Math.min(x+25,25-x);const fade=THREE.MathUtils.smoothstep(edge,0,4.8);ribbon.mesh.position.x=x;ribbon.mesh.position.y=.128+Math.sin(flowTime*1.8+ribbon.offset)*.004;ribbon.mesh.position.z=ribbon.z+Math.sin(flowTime*.7+ribbon.offset)*.055;ribbon.material.opacity=(.025+.19*fade)*(.78+.22*Math.sin(flowTime*1.35+ribbon.offset));}for(const current of riverCurrentObjects){const x=-25+((current.phase+flowTime*current.speed)%50);const edge=Math.min(x+25,25-x);const fade=THREE.MathUtils.smoothstep(edge,0,4.2);current.mesh.position.x=x;current.mesh.position.y=.116+Math.sin(flowTime*1.7+current.offset)*.003;current.mesh.position.z=current.baseZ+Math.sin(flowTime*.62+current.offset)*.045;current.material.opacity=(.035+.19*fade)*(.82+.18*Math.sin(flowTime*1.25+current.offset));}for(const item of riverMotionObjects){const wave=Math.sin(flowTime*item.speed+item.phase);item.mesh.position.x=item.baseX+Math.sin(flowTime*item.speed*.72+item.phase)*item.range;item.mesh.position.y=.092+Math.max(0,wave)*.018;const pulse=.78+.22*Math.sin(flowTime*item.speed*1.8+item.phase);item.mesh.scale.x=pulse;item.mesh.material.opacity=item.baseLength<.6?.13+.16*(.5+.5*wave):.12+.12*(.5+.5*wave)}for(const ring of riverRingObjects){const cycle=(flowTime*ring.speed+ring.phase)%(Math.PI*2),progress=(1-Math.cos(cycle))*.5;const radius=.12+progress*.72;ring.mesh.position.x=ring.baseX+Math.sin(flowTime*.31+ring.phase)*.12;ring.mesh.position.z=ring.baseZ+Math.cos(flowTime*.27+ring.phase)*.1;ring.mesh.scale.set(radius,1,radius*.72);ring.material.opacity=.2*(1-progress)}for(const foam of riverFoamObjects){const drift=(flowTime*foam.speed+foam.phase)%(Math.PI*2);foam.mesh.position.x=foam.baseX+Math.sin(drift)*foam.drift;foam.mesh.position.y=.108+Math.max(0,Math.sin(drift*1.35+foam.phase))*.012;foam.mesh.position.z=foam.baseZ+Math.cos(drift*.7)*.16;const pulse=.68+.32*Math.sin(drift*1.6);foam.mesh.scale.x=(.22+(foam.phase%3)*.06)*pulse;foam.mesh.scale.z=(.055+(foam.phase%2)*.018)*(.88+.12*Math.cos(drift));foam.material.opacity=.045+.11*(.5+.5*Math.sin(drift+foam.phase))}for(const streak of riverDriftStreaks){const travel=(streak.phase+flowTime*streak.speed)%50;const edge=Math.min(travel,50-travel);const fade=THREE.MathUtils.smoothstep(edge,0,5.2);const pulse=.72+.28*Math.sin(flowTime*2.1+streak.offset);streak.mesh.position.x=-25+travel;streak.mesh.position.y=.137+Math.sin(flowTime*1.45+streak.offset)*.004;streak.mesh.position.z=streak.z+Math.sin(flowTime*.72+streak.offset)*.035;streak.mesh.scale.x=.82+.38*pulse;streak.material.opacity=(.035+.19*fade)*pulse;}for(const crest of riverWaveCrests){const travel=(crest.phase+flowTime*crest.speed)%50;const edge=Math.min(travel,50-travel);const fade=THREE.MathUtils.smoothstep(edge,0,5.5);const swell=Math.sin(flowTime*1.7+crest.offset);crest.mesh.position.x=-25+travel;crest.mesh.position.y=.145+Math.max(0,swell)*.012;crest.mesh.position.z=crest.z+Math.sin(flowTime*.83+crest.offset)*.06;crest.mesh.rotation.y=Math.sin(flowTime*.55+crest.offset)*.035;crest.material.opacity=(.018+.16*fade)*(.68+.32*(.5+.5*swell));}renderer.render(scene,camera)}animate();

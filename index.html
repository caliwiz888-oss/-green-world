<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>GREEN WORLD</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#9bd5ed;
}
canvas{display:block}
#hud{
  position:absolute;
  top:12px;
  left:10px;
  right:10px;
  display:flex;
  justify-content:space-between;
  gap:8px;
  color:white;
  z-index:2;
  pointer-events:none;
}
.panel{
  background:#245c38ed;
  padding:11px 13px;
  border-radius:14px;
  font-weight:bold;
  font-size:14px;
  box-shadow:0 3px 10px #0004;
}
#hint{
  position:absolute;
  bottom:91px;
  left:10px;
  right:10px;
  width:max-content;
  max-width:calc(100% - 20px);
  color:white;
  background:#245c38e8;
  padding:10px 13px;
  border-radius:10px;
  z-index:2;
  font-size:13px;
}
#actions{
  position:absolute;
  bottom:15px;
  left:7px;
  right:7px;
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:7px;
  z-index:3;
}
button{
  border:0;
  border-radius:12px;
  padding:12px 13px;
  background:#287b42;
  color:white;
  font-weight:bold;
  font-size:13px;
  box-shadow:0 3px 8px #0004;
}
button:active{transform:scale(.96)}
</style>
</head>

<body>

<div id="hud">
  <div class="panel">
    🌳 GREEN WORLD<br>
    <span>Аурелион · Уровень 1</span>
  </div>
  <div class="panel">
    🪙 <span id="coins">100</span> AURA<br>
    🍎 <span id="apples">0</span>
  </div>
</div>

<div id="hint">Добро пожаловать в Аурелион!</div>

<div id="actions">
  <button onclick="plant()">🌱 Посадить</button>
  <button onclick="water()">💧 Полить</button>
  <button onclick="harvest()">🍎 Собрать</button>
  <button onclick="sell()">🛒 Продать</button>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

// ===== ОСНОВА МИРА =====
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bd5ed);
scene.fog = new THREE.Fog(0x9bd5ed,45,100);

const camera = new THREE.PerspectiveCamera(
  45,innerWidth/innerHeight,0.1,180
);
camera.position.set(28,32,34);
camera.lookAt(0,0,0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// ===== ОСВЕЩЕНИЕ =====
scene.add(new THREE.HemisphereLight(0xffffff,0x557744,2));

const sun = new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(15,30,15);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-35;
sun.shadow.camera.right=35;
sun.shadow.camera.top=35;
sun.shadow.camera.bottom=-35;
scene.add(sun);

// ===== МАТЕРИАЛЫ =====
function material(color,roughness=0.85){
  return new THREE.MeshStandardMaterial({color,roughness});
}

function addBox(parent,w,h,d,color,x,y,z){
  const mesh=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    material(color)
  );
  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  parent.add(mesh);
  return mesh;
}

// ===== ЗЕМЛЯ =====
const ground=new THREE.Mesh(
  new THREE.PlaneGeometry(60,60),
  material(0x65a94e)
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-0.13;
ground.receiveShadow=true;
scene.add(ground);

// ===== ПЛАНТАЦИЯ 20 × 20 =====
const plots=[];
const plotMaterial1=material(0x9a7547);
const plotMaterial2=material(0xb58a53);

for(let x=0;x<20;x++){
  for(let z=0;z<20;z++){
    const tile=new THREE.Mesh(
      new THREE.BoxGeometry(1.72,0.12,1.72),
      (x+z)%2?plotMaterial1:plotMaterial2
    );
    tile.position.set(x-9.5,0,z-9.5);
    tile.receiveShadow=true;
    scene.add(tile);
    plots.push({
      x:x-9.5,
      z:z-9.5,
      tree:null
    });
  }
}

// ===== ОСОБНЯК =====
const mansion=new THREE.Group();

addBox(mansion,7,3.5,5,0xf0d4a0,0,1.75,0);
addBox(mansion,2.5,2.7,4,0xe8c99a,-4.5,1.35,0);
addBox(mansion,2.5,2.7,4,0xe8c99a,4.5,1.35,0);

const mansionRoof=new THREE.Mesh(
  new THREE.ConeGeometry(5.5,3,4),
  material(0x963c32)
);
mansionRoof.position.set(0,4.8,0);
mansionRoof.rotation.y=Math.PI/4;
mansion.add(mansionRoof);

for(const x of [-4.5,4.5]){
  const tower=new THREE.Mesh(
    new THREE.CylinderGeometry(0.8,0.9,4,12),
    material(0xf0d9b4)
  );
  tower.position.set(x,3,0);
  mansion.add(tower);

  const top=new THREE.Mesh(
    new THREE.ConeGeometry(1.1,2,12),
    material(0x74352e)
  );
  top.position.set(x,6,0);
  mansion.add(top);
}

// Окна
for(const x of [-2,0,2]){
  addBox(mansion,0.8,1.1,0.12,0x6bb7d8,x,2.1,2.56);
}

// Дверь
addBox(mansion,1.1,2,0.15,0x70452b,0,1,2.6);

mansion.position.set(-13,0,-9);
scene.add(mansion);

// ===== ФОНТАН =====
const fountain=new THREE.Group();

const basin=new THREE.Mesh(
  new THREE.CylinderGeometry(2.2,2.2,0.35,32),
  material(0xc5cbd0)
);
basin.position.y=0.2;
fountain.add(basin);

const pool=new THREE.Mesh(
  new THREE.CylinderGeometry(1.9,1.9,0.08,32),
  new THREE.MeshStandardMaterial({
    color:0x39bde5,
    metalness:0.3,
    roughness:0.2
  })
);
pool.position.y=0.42;
fountain.add(pool);

const column=new THREE.Mesh(
  new THREE.CylinderGeometry(0.3,0.45,1.5,16),
  material(0xe9e3d6)
);
column.position.y=1;
fountain.add(column);

const fountainBall=new THREE.Mesh(
  new THREE.SphereGeometry(0.4,16,16),
  material(0x55c9e8,0.25)
);
fountainBall.position.y=1.9;
fountain.add(fountainBall);

fountain.position.set(-5,0,-7);
scene.add(fountain);

// ===== РЕКА =====
const river=new THREE.Mesh(
  new THREE.PlaneGeometry(42,4.5),
  new THREE.MeshStandardMaterial({
    color:0x36aee0,
    metalness:0.2,
    roughness:0.25
  })
);
river.rotation.x=-Math.PI/2;
river.position.set(0,0.025,21);
scene.add(river);

// ===== КАМЕННЫЙ МОСТ =====
const bridge=new THREE.Group();

addBox(bridge,7,0.5,3.2,0xbab2a0,0,0.7,0);

for(const x of [-3.2,3.2]){
  addBox(bridge,0.35,0.9,3.2,0xe1d5c1,x,1.3,0);
}

for(let x=-2.5;x<=2.5;x+=1){
  addBox(bridge,0.1,0.1,2.7,0x918878,x,0.98,0);
}

bridge.position.set(1,0,21);
scene.add(bridge);

// ===== ДЕРЕВЬЯ =====
function decorativeTree(x,z,size=1){
  const tree=new THREE.Group();

  const trunk=new THREE.Mesh(
    new THREE.CylinderGeometry(0.2,0.3,1.5,8),
    material(0x704323)
  );
  trunk.position.y=0.75;
  trunk.castShadow=true;
  tree.add(trunk);

  const crown=new THREE.Mesh(
    new THREE.SphereGeometry(1.1,12,12),
    material(0x267b38)
  );
  crown.position.y=2;
  crown.castShadow=true;
  tree.add(crown);

  tree.position.set(x,0,z);
  tree.scale.setScalar(size);
  scene.add(tree);
}

[
  [-19,-5],[-18,1],[-18,8],
  [18,-5],[19,2],[18,9],
  [-15,17],[15,17],
  [-20,14],[20,14]
].forEach(p=>decorativeTree(p[0],p[1],1.3));

// ===== МЕЛЬНИЦА =====
const mill=new THREE.Group();

const millBody=new THREE.Mesh(
  new THREE.CylinderGeometry(1.1,1.5,4,8),
  material(0xe6d1a8)
);
millBody.position.y=2;
mill.add(millBody);

const millRoof=new THREE.Mesh(
  new THREE.ConeGeometry(1.5,1.5,8),
  material(0x8d4935)
);
millRoof.position.y=4.7;
mill.add(millRoof);

const sails=new THREE.Group();

for(let i=0;i<4;i++){
  const blade=new THREE.Mesh(
    new THREE.BoxGeometry(0.35,3.5,0.15),
    material(0xf4e9d2)
  );
  blade.position.y=1.7;
  blade.rotation.z=i*Math.PI/2;
  sails.add(blade);
}

sails.position.set(0,3.3,1.15);
mill.add(sails);
mill.userData.sails=sails;

mill.position.set(15,0,-9);
scene.add(mill);

// ===== ГОРЫ =====
for(let i=0;i<11;i++){
  const mountain=new THREE.Mesh(
    new THREE.ConeGeometry(5,10,5),
    material(i%2?0x759b75:0x88a77c)
  );
  mountain.position.set(-30+i*6,-1,-29);
  mountain.castShadow=true;
  scene.add(mountain);
}

// ===== ЯБЛОНИ =====
function makeTree(x,z){
  const tree=new THREE.Group();

  const trunk=new THREE.Mesh(
    new THREE.CylinderGeometry(0.18,0.25,1.6,8),
    material(0x754323)
  );
  trunk.position.y=0.8;
  trunk.castShadow=true;
  tree.add(trunk);

  const crown=new THREE.Mesh(
    new THREE.SphereGeometry(1.05,12,10),
    material(0x258b39)
  );
  crown.position.y=2;
  crown.castShadow=true;
  tree.add(crown);

  for(let i=0;i<5;i++){
    const apple=new THREE.Mesh(
      new THREE.SphereGeometry(0.13,8,8),
      material(0xd92720)
    );
    apple.position.set(
      Math.cos(i*1.25)*0.75,
      1.8+(i%2)*0.4,
      Math.sin(i*1.25)*0.75
    );
    tree.add(apple);
  }

  tree.position.set(x,0,z);
  tree.userData.grown=false;
  scene.add(tree);
  return tree;
}

// ===== ЭКОНОМИКА =====
let coins=Number(localStorage.getItem('coins')??100);
let apples=Number(localStorage.getItem('apples')??0);
let trees=[];

function update(){
  document.getElementById('coins').textContent=coins;
  document.getElementById('apples').textContent=apples;
  localStorage.setItem('coins',coins);
  localStorage.setItem('apples',apples);
}

function hint(message){
  document.getElementById('hint').textContent=message;
}

function addTree(plot){
  plot.tree=makeTree(plot.x,plot.z);
  trees.push(plot.tree);
}

// Пять стартовых яблонь
[0,1,2,3,4].forEach(i=>{
  addTree(plots[i*3+22]);
});

update();

// ===== ПОСАДКА =====
window.plant=function(){
  const plot=plots.find(p=>!p.tree);

  if(!plot){
    hint('Свободной земли нет!');
    return;
  }

  if(coins<10){
    hint('Недостаточно AURA!');
    return;
  }

  coins-=10;
  addTree(plot);
  update();
  hint('Посажена новая яблоня! -10 AURA');
};

// ===== ПОЛИВ =====
window.water=function(){
  const tree=trees.find(t=>!t.userData.grown);

  if(!tree){
    hint('Все яблони уже выросли!');
    return;
  }

  tree.userData.grown=true;
  tree.scale.setScalar(1.15);
  hint('Яблоня полита! Можно собирать урожай.');
};

// ===== СБОР =====
window.harvest=function(){
  const tree=trees.find(t=>t.userData.grown);

  if(!tree){
    hint('Сначала полей яблоню!');
    return;
  }

  apples+=5;
  tree.userData.grown=false;
  tree.scale.setScalar(1);
  update();
  hint('Собрано 5 яблок!');
};

// ===== ПРОДАЖА =====
window.sell=function(){
  if(apples===0){
    hint('У тебя пока нет яблок!');
    return;
  }

  coins+=apples*2;
  const sold=apples;
  apples=0;
  update();
  hint('Продано '+sold+' яблок! Получено '+sold*2+' AURA.');
};

// ===== АНИМАЦИЯ =====
const clock=new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);

  const time=clock.getElapsedTime();

  // Вращение лопастей мельницы
  sails.rotation.z=time*0.8;

  // Лёгкое движение воды
  pool.material.opacity=0.85+Math.sin(time*2)*0.1;

  renderer.render(scene,camera);
}

animate();

// ===== ИЗМЕНЕНИЕ РАЗМЕРА ЭКРАНА =====
window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>

bridge.position.set(1,0,21);
scene.add(bridge);

// ===== ДЕРЕВЬЯ =====
function decorativeTree(x,z,size=1){
  const tree=new THREE.Group();

  const trunk=new THREE.Mesh(
    new THREE.CylinderGeometry(0.2,0.3,1.5,8),
    material(0x704323)
  );
  trunk.position.y=0.75;
  trunk.castShadow=true;
  tree.add(trunk);

  const crown=new THREE.Mesh(
    new THREE.SphereGeometry(1.1,12,12),
    material(0x267b38)
  );
  crown.position.y=2;
  crown.castShadow=true;
  tree.add(crown);

  tree.position.set(x,0,z);
  tree.scale.setScalar(size);
  scene.add(tree);
}

[
  [-19,-5],[-18,1],[-18,8],
  [18,-5],[19,2],[18,9],
  [-15,17],[15,17],
  [-20,14],[20,14]
].forEach(p=>decorativeTree(p[0],p[1],1.3));

// ===== ЯБЛОНИ =====
function makeTree(x,z){
  const tree=new THREE.Group();

  const trunk=new THREE.Mesh(
    new THREE.CylinderGeometry(0.18,0.25,1.6,8),
    material(0x754323)
  );
  trunk.position.y=0.8;
  trunk.castShadow=true;
  tree.add(trunk);

  const crown=new THREE.Mesh(
    new THREE.SphereGeometry(1.05,12,10),
    material(0x258b39)
  );
  crown.position.y=2;
  crown.castShadow=true;
  tree.add(crown);

  for(let i=0;i<5;i++){
    const apple=new THREE.Mesh(
      new THREE.SphereGeometry(0.13,8,8),
      material(0xd92720)
    );
    apple.position.set(
      Math.cos(i*1.25)*0.75,
      1.8+(i%2)*0.4,
      Math.sin(i*1.25)*0.75
    );
    tree.add(apple);
  }

  tree.position.set(x,0,z);
  tree.userData.grown=false;
  scene.add(tree);
  return tree;
}

// ===== ЭКОНОМИКА =====
let coins=Number(localStorage.getItem('coins')??100);
let apples=Number(localStorage.getItem('apples')??0);
let trees=[];

function update(){
  document.getElementById('coins').textContent=coins;
  document.getElementById('apples').textContent=apples;
  localStorage.setItem('coins',coins);
  localStorage.setItem('apples',apples);
}

function hint(message){
  document.getElementById('hint').textContent=message;
}

function addTree(plot){
  plot.tree=makeTree(plot.x,plot.z);
  trees.push(plot.tree);
}

// Пять стартовых яблонь
[0,1,2,3,4].forEach(i=>{
  addTree(plots[i*3+22]);
});

update();

// ===== ПОСАДКА =====
window.plant=function(){
  const plot=plots.find(p=>!p.tree);

  if(!plot){
    hint('Свободной земли нет!');
    return;
  }

  if(coins<10){
    hint('Недостаточно AURA!');
    return;
  }

  coins-=10;
  addTree(plot);
  update();
  hint('Посажена новая яблоня! -10 AURA');
};

// ===== ПОЛИВ =====
window.water=function(){
  const tree=trees.find(t=>!t.userData.grown);

  if(!tree){
    hint('Все яблони уже выросли!');
    return;
  }

  tree.userData.grown=true;
  tree.scale.setScalar(1.15);
  hint('Яблоня полита! Можно собирать урожай.');
};

// ===== СБОР =====
window.harvest=function(){
  const tree=trees.find(t=>t.userData.grown);

  if(!tree){
    hint('Сначала полей яблоню!');
    return;
  }

  apples+=5;
  tree.userData.grown=false;
  tree.scale.setScalar(1);
  update();
  hint('Собрано 5 яблок!');
};

// ===== ПРОДАЖА =====
window.sell=function(){
  if(apples===0){
    hint('У тебя пока нет яблок!');
    return;
  }

  coins+=apples*2;
  const sold=apples;
  apples=0;
  update();
  hint('Продано '+sold+' яблок! Получено '+sold*2+' AURA.');
};

// ===== АНИМАЦИЯ =====
const clock=new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);

  const time=clock.getElapsedTime();

  // Вращение лопастей мельницы
  sails.rotation.z=time*0.8;

  // Лёгкое движение воды
  pool.material.opacity=0.85+Math.sin(time*2)*0.1;

  renderer.render(scene,camera);
}

animate();

// ===== ИЗМЕНЕНИЕ РАЗМЕРА ЭКРАНА =====
window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>

name: Backend tests

on:
  push:
    paths:
      - 'backend/**'
      - 'index.html'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'index.html'
      - '.github/workflows/backend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: backend
        run: npm install
      - name: Run backend tests
        working-directory: backend
        run: npm test
      - name: Check server syntax
        working-directory: backend
        run: node --check server.js
      - name: Check frontend module syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text()
          match = re.search(r'<script type="module">(.*?)</script>', html, re.S)
          if not match:
              raise SystemExit('Frontend module script not found')
          Path('/tmp/green-world-frontend.mjs').write_text(match.group(1))
          PY
          node --check /tmp/green-world-frontend.mjs
